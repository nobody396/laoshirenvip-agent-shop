services:
  app:
    networks:
      default: {}
      security_ingress:
        ipv4_address: 172.29.222.3
    environment:
      SERVER_TRUSTED_PROXIES: "172.29.222.2/32"
      # Production must fail closed instead of starting a checkout that can
      # display the channel but cannot sign live EPay requests.
      ZHENCHUAN_EPAY_MERCHANT_ID: ${ZHENCHUAN_EPAY_MERCHANT_ID:?required}
      ZHENCHUAN_EPAY_MERCHANT_KEY_MD5: ${ZHENCHUAN_EPAY_MERCHANT_KEY_MD5:?required}
      # Keep production aligned with the approved one-day confirmation policy.
      RESELLER_SETTLEMENT_CONFIRM_DAYS: "1"

  proxy:
    networks:
      security_ingress:
        ipv4_address: 172.29.222.2
    image: caddy:2.10-alpine
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ./tls/origin.pem:/etc/caddy/tls/origin.pem:ro
      - ./tls/origin-key.pem:/etc/caddy/tls/origin-key.pem:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

# Dedicated two-service network avoids rebuilding the live DB/Redis network.
networks:
  security_ingress:
    ipam:
      config:
        - subnet: 172.29.222.0/29
