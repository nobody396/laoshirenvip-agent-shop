services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_shop
      POSTGRES_USER: agent_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_shop -d agent_shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    image: ${APP_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?required}
      APP_TOTP_ISSUER: 老实人VIP代理
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_DRIVER: postgres
      DATABASE_DSN: host=postgres user=agent_shop password=${POSTGRES_PASSWORD} dbname=agent_shop port=5432 sslmode=disable TimeZone=Asia/Shanghai
      DATABASE_POOL_MAX_OPEN_CONNS: "20"
      DATABASE_POOL_MAX_IDLE_CONNS: "5"
      JWT_SECRET: ${JWT_SECRET:?required}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?required}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      QUEUE_ENABLED: "true"
      QUEUE_HOST: redis
      QUEUE_PORT: "6379"
      QUEUE_PASSWORD: ${REDIS_PASSWORD:?required}
      RESELLER_ENABLED: "true"
      RESELLER_SELF_APPLY_ENABLED: "true"
      RESELLER_SETTLEMENT_CONFIRM_DAYS: "7"
      RESELLER_MAIN_HOSTS: ${MAIN_HOSTS:?required}
      RESELLER_TRUSTED_FORWARDED_HOST: "true"
      RESELLER_SUBDOMAIN_BASE: ${SUBDOMAIN_BASE:-}
      WEB_ADMIN_PATH: ${ADMIN_PATH:?required}
      DJ_DEFAULT_ADMIN_USERNAME: ${ADMIN_USERNAME:?required}
      DJ_DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1536M

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.acceptance.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  redis-data:
  uploads:
  logs:
